<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>True In-Cell 4:3 Image Grid</title>
  <style>
    :root { --excel-green: #217346; }
    body {
      font-family: 'Segoe UI', sans-serif; background: #f3f4f6;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
    }
    .container {
      background: white; padding: 2.5rem; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 520px; text-align: center;
    }
    .upload-area { border: 2px dashed #ccc; padding: 20px; border-radius: 8px; margin: 20px 0; }
    button {
      background: var(--excel-green); color: white; border: none; padding: 12px 24px;
      border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s;
    }
    button:disabled { background: #a0a0a0; cursor: not-allowed; }
    #status-log {
      margin-top: 20px; text-align: left; font-size: 0.8rem; background: #1e1e1e; color: #00ff00;
      padding: 12px; border-radius: 6px; height: 160px; overflow-y: auto; font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color: var(--excel-green);">In-Cell 4:3 Image Grid</h2>
    <p>Using <b>embed_image</b> for true "Place in Cell" functionality.</p>

    <div class="upload-area">
      <input type="file" id="fileInput" multiple accept="image/png, image/jpeg"/>
    </div>

    <button id="convertBtn" disabled>Loading Python...</button>
    <div id="status-log">System: Initializing...</div>
  </div>

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

    let pyodide;

    function log(msg) {
      const logger = document.getElementById('status-log');
      logger.innerHTML += `<div>> ${msg}</div>`;
      logger.scrollTop = logger.scrollHeight;
    }

    async function initPy() {
      try {
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/",
        });
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        log("Installing XlsxWriter (Latest) & Pillow...");
        await micropip.install("xlsxwriter>=3.1.2");
        await micropip.install("Pillow");
        document.getElementById('convertBtn').disabled = false;
        document.getElementById('convertBtn').innerText = "Generate True In-Cell Excel";
        log("System Ready.");
      } catch (err) {
        log("Error during init: " + err.message);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initPy);
    } else {
      initPy();
    }

    document.getElementById('convertBtn').addEventListener('click', async () => {
      const files = document.getElementById('fileInput').files;
      if (files.length === 0) return alert("Please select images first.");

      document.getElementById('convertBtn').disabled = true;
      log(`Processing ${files.length} images...`);

      const fileNames = [];
      const displayNames = [];

      for (let i = 0; i < files.length; i++) {
        const buffer = await files[i].arrayBuffer();
        const safeName = `img_${i}.png`;
        pyodide.FS.writeFile(safeName, new Uint8Array(buffer));
        fileNames.push(safeName);
        displayNames.push(files[i].name);
      }

      const pythonCode = `
import io
from PIL import Image, ImageOps
import xlsxwriter

file_names    = ${JSON.stringify(fileNames)}
display_names = ${JSON.stringify(displayNames)}
output_file   = 'true_in_cell_report.xlsx'

# --- Cell sizing targets ---
target_w_px = 320
target_h_px = 240

def pixels_to_col_width(px): return round(px / 7.0 - 0.75, 2)
def pixels_to_points(px):    return round(px * 3.0 / 4.0, 2)

col_w_chars = pixels_to_col_width(target_w_px)
row_h_pts   = pixels_to_points(target_h_px)

workbook = xlsxwriter.Workbook(output_file)
ws = workbook.add_worksheet("Images")

ws.set_column('A:A', 35)
ws.set_column('B:B', col_w_chars)

hdr_fmt = workbook.add_format({'bold': True, 'bg_color': '#D9EAD3', 'border': 1})
ws.write(0, 0, "Image Name", hdr_fmt)
ws.write(0, 1, "Image (In-Cell)", hdr_fmt)

for i, (path, disp_name) in enumerate(zip(file_names, display_names), start=1):
    ws.set_row(i, row_h_pts)
    ws.write(i, 0, disp_name)

    try:
        with Image.open(path) as img:
            img = ImageOps.exif_transpose(img)

            # Crop to 4:3
            img_ratio = img.width / img.height
            target_ratio = 4/3
            if img_ratio > target_ratio:
                new_w = int(img.height * target_ratio)
                left = (img.width - new_w) // 2
                img = img.crop((left, 0, left + new_w, img.height))
            else:
                new_h = int(img.width / target_ratio)
                top = (img.height - new_h) // 2
                img = img.crop((0, top, img.width, top + new_h))

            # Final Resize
            img = img.resize((target_w_px, target_h_px), Image.Resampling.LANCZOS)

            bio = io.BytesIO()
            img.save(bio, format='PNG')
            bio.seek(0)

            # --- THE KEY CHANGE: embed_image ---
            # This places the image INSIDE the cell as a value
            ws.embed_image(i, 1, path, {'image_data': bio})

    except Exception as e:
        ws.write(i, 1, f"Error: {e}")

workbook.close()
`;

      try {
        await pyodide.runPythonAsync(pythonCode);
        const data = pyodide.FS.readFile('true_in_cell_report.xlsx');
        const blob = new Blob([data], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = "True_InCell_Images.xlsx";
        link.click();
        log("Success! Open the file in Excel 365/2021+ to see the feature.");
      } catch (err) {
        log("Error: " + err.message);
      } finally {
        document.getElementById('convertBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
